(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample2) {

    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 기반 네비게이션 자동 연결
  const pathMap = {
    'home-dashboard': '홈.html',
    'daily-feed': '홈.html',

    'baby-log': '기록.html',

    'parent-profile': '마이.html',
    'parenting-guide': '스케줄.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

    isTimerRunning[side] = !isTimerRunning[side];
    if (isTimerRunning[side]) {
      el.classList.add('bg-primary', 'text-on-primary');
      el.classList.remove('bg-surface-container-low', 'text-primary');
      showToast(`${side === 'L' ? '좌측' : '우측'} 모유 수유 타이머가 시작되었습니다.`);

      el.classList.remove('bg-primary', 'text-on-primary');
      el.classList.add('bg-surface-container-low', 'text-primary');
      showToast(`${side === 'L' ? '좌측' : '우측'} 수유가 완료되어 기록되었습니다.`);
    }
  }

  // 수면 타이머 토글
  let sleeping = false;
  function toggleSleepTimer(btn) {
    sleeping = !sleeping;
    if (sleeping) {
      btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">wb_sunny</span> 아기 깨우기';
      btn.classList.remove('bg-secondary');
      btn.classList.add('bg-tertiary');
      showToast('아기가 잠들었습니다. 조용한 환경을 만들어주세요 🌙');

      btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">dark_mode</span> 낮잠 재우기';
      btn.classList.add('bg-secondary');
      btn.classList.remove('bg-tertiary');
      showToast('낮잠이 종료되고 수면 시간이 자동 기록되었습니다 ☀️');

  // 일반 토스트 알림
  function flashSuccess(btn, msg) {
    showToast(msg);
  }

  function showToast(text) {
    const toast = document.getElementById('toastNotification');
    const msg = document.getElementById('toastMessage');
    if (!toast || !msg) return;

    msg.innerText = text;
    toast.classList.remove('hidden');

    clearTimeout(window.__toastTimeout);
    window.__toastTimeout = setTimeout(() => {
      toast.classList.add('hidden');
    }, 2400);

  // 타임라인 / 캘린더 뷰 전환
  function switchView(mode) {
    const timelineView = document.getElementById('timelineView');
    const calendarView = document.getElementById('calendarView');
    const tabTimeline = document.getElementById('viewTabTimeline');
    const tabCalendar = document.getElementById('viewTabCalendar');

    if (mode === 'timeline') {
      timelineView.classList.remove('hidden');
      calendarView.classList.add('hidden');
      tabTimeline.className = 'px-3 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-lowest text-primary shadow-xs font-semibold transition-all';
      tabCalendar.className = 'px-3 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all';
    } else {
      timelineView.classList.add('hidden');
      calendarView.classList.remove('hidden');
      tabCalendar.className = 'px-3 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-lowest text-primary shadow-xs font-semibold transition-all';
      tabTimeline.className = 'px-3 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all';
    }
  }

  // 아코디언 토글
  function toggleAccordion(id) {
    const content = document.getElementById(id);
    const arrow = document.getElementById('tipArrow');
    if (content.classList.contains('hidden')) {
      content.classList.remove('hidden');
      arrow.style.transform = 'rotate(0deg)';
    } else {
      content.classList.add('hidden');
      arrow.style.transform = 'rotate(-90deg)';
    }
  }

  // 토글 인터랙션 피드백 토스트
  let toastTimer = null;
  function handleToggleFeedback(checkbox, name) {
    const toast = document.getElementById('toastFeedback');
    const toastMsg = document.getElementById('toastMsg');
    const state = checkbox.checked ? '켜졌습니다.' : '꺼졌습니다.';
    toastMsg.textContent = `${name} 알림이 ${state}`;
    
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');

    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2200);
  }
</script></main>

      girlBtn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";

  function selectRole(button) {
    const parent = document.getElementById('roleGroup');
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(btn => {

    heartIcon.innerText = 'favorite';
    button.prepend(heartIcon);

      container.classList.add('hidden');

<script id="ibom-sample2-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample2) {
      window.parent.navigateSample2(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 기반 네비게이션 자동 연결
  const pathMap = {
    'home-dashboard': '홈.html',
    'daily-feed': '홈.html',
    'home': '홈.html',
    'baby-log': '기록.html',
    'growth-records': '기록.html',
    'quick-logger': '기록.html',
    'family-outing': '지도.html',
    'outing': '지도.html',
    'baby-shopping': '쇼핑.html',
    'shopping': '쇼핑.html',
    'mom-community': '단체.html',
    'community': '커뮤.html',
    'chat-community': '채팅.html',
    'parent-profile': '마이.html',
    'parenting-guide': '스케줄.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 스케줄, 프로필 -> 마이)
  const header = document.querySelector('header');
  if (header) {
    // 로고 영역 클릭 시 홈으로 이동 (뒤로가기 버튼이 없는 메인 헤더인 경우)
    const leftBox = header.querySelector('.flex.items-center.gap-space-sm');
    if (leftBox && !leftBox.querySelector('button')) {
      leftBox.style.cursor = 'pointer';
      leftBox.addEventListener('click', () => go('홈.html'));
    }

    // 알림 버튼 -> 스케줄.html
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          go('스케줄.html');
        });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample2) {
            window.parent.navigateBackSample2();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });

    // 우측 상단 person 아이콘 또는 프로필 이미지 -> 마이.html
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const p = span.closest('div, a, button');
        if (p) {
          p.style.cursor = 'pointer';
          p.addEventListener('click', (e) => {
            e.preventDefault();
            go('마이.html');
          });
        }
      }
    });
  }

  // 3. 각 페이지별 주요 버튼 및 배너/카드 인터랙션 연결
  document.querySelectorAll('button, a, article, section, div').forEach(el => {
    const text = (el.innerText || '').trim();
    const aria = el.getAttribute('aria-label') || '';

    // [로그인.html]
    if (el.tagName === 'BUTTON' && (
      text.includes('카카오로 3초 만에 시작하기') ||
      text.includes('네이버로 시작하기') ||
      text.includes('Apple로 계속하기') ||
      text.includes('이메일 또는 휴대폰 번호로 로그인') ||
      text.includes('둘러보기 모드 체험')
    )) {
      el.addEventListener('click', () => go('홈.html'));
    }
    if (el.tagName === 'BUTTON' && text === '회원가입') {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [아기.html]
    if (el.id === 'startBtn' || (el.tagName === 'BUTTON' && text.includes('아이봄 맞춤 케어 시작하기'))) {
      el.onclick = (e) => {
        e.preventDefault();
        el.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>맞춤 케어 큐레이션 구성 중...</span>';
        setTimeout(() => go('홈.html'), 500);
      };
    }

    // [홈.html]
    if (aria === '아이 성장일기 바로가기' || aria === '아이 정보 변경') {
      el.addEventListener('click', () => go('아기.html'));
    }
    if (el.tagName === 'A' && text.includes('다음 예방접종:')) {
      el.setAttribute('href', '스케줄.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('스케줄.html'); });
    }
    if (el.tagName === 'A' && text.includes('전체 타임라인')) {
      el.setAttribute('href', '기록.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('기록.html'); });
    }
    if (el.tagName === 'A' && text === '더보기') {
      el.setAttribute('href', '지도.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('지도.html'); });
    }
    if (el.tagName === 'A' && (text.includes('베베숲 에코 라인') || text.includes('메르베 프리미엄 오가닉'))) {
      el.setAttribute('href', '쇼핑.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('쇼핑.html'); });
    }

    // [기록.html]
    if (el.tagName === 'BUTTON' && text.includes('전체보기')) {
      el.addEventListener('click', () => go('스케줄.html'));
    }

    // [스케줄.html]
    if (el.tagName === 'BUTTON' && (text.includes('인근 소아과 바로 예약') || text === '예약하기')) {
      el.addEventListener('click', () => go('지도.html'));
    }
    if (el.tagName === 'BUTTON' && (text.includes('상세보기') || text.includes('문진표 작성'))) {
      el.addEventListener('click', () => go('기록.html'));

<script>
  function toggleReaction(btn) {
    const icon = btn.querySelector('.material-symbols-outlined');
    const countEl = btn.querySelector('.count');
    const isLiked = icon.style.fontVariationSettings?.includes("'FILL' 1");
    let count = parseInt(countEl.textContent, 10);

    if (isLiked) {
      icon.style.fontVariationSettings = "'FILL' 0";
      btn.classList.remove('text-primary');
      btn.classList.add('text-on-surface-variant');
      countEl.textContent = count - 1;
    } else {
      icon.style.fontVariationSettings = "'FILL' 1";
      btn.classList.remove('text-on-surface-variant');
      btn.classList.add('text-primary');
      countEl.textContent = count + 1;

      // Delight micro-haptic burst
      btn.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.3)' },
        { transform: 'scale(1)' }
      ], { duration: 250, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)' });
    }
  }

  // Soft tactile button interactions
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('touchstart', () => {}, { passive: true });
  });

    'parenting-guide': '스케줄.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);

<script id="ibom-sample2-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample2) {
      window.parent.navigateSample2(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 기반 네비게이션 자동 연결
  const pathMap = {
    'home-dashboard': '홈.html',
    'daily-feed': '홈.html',
    'home': '홈.html',
    'baby-log': '기록.html',
    'growth-records': '기록.html',
    'quick-logger': '기록.html',
    'family-outing': '지도.html',
    'outing': '지도.html',
    'baby-shopping': '쇼핑.html',
    'shopping': '쇼핑.html',
    'mom-community': '단체.html',
    'community': '커뮤.html',
    'chat-community': '채팅.html',
    'parent-profile': '마이.html',
    'parenting-guide': '스케줄.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 스케줄, 프로필 -> 마이)
  const header = document.querySelector('header');
  if (header) {
    // 로고 영역 클릭 시 홈으로 이동 (뒤로가기 버튼이 없는 메인 헤더인 경우)
    const leftBox = header.querySelector('.flex.items-center.gap-space-sm');
    if (leftBox && !leftBox.querySelector('button')) {
      leftBox.style.cursor = 'pointer';
      leftBox.addEventListener('click', () => go('홈.html'));
    }

    // 알림 버튼 -> 스케줄.html
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          go('스케줄.html');
        });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample2) {
            window.parent.navigateBackSample2();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });

    // 우측 상단 person 아이콘 또는 프로필 이미지 -> 마이.html
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const p = span.closest('div, a, button');
        if (p) {
          p.style.cursor = 'pointer';
          p.addEventListener('click', (e) => {
            e.preventDefault();
            go('마이.html');
          });
        }
      }
    });
  }

  // 3. 각 페이지별 주요 버튼 및 배너/카드 인터랙션 연결
  document.querySelectorAll('button, a, article, section, div').forEach(el => {
    const text = (el.innerText || '').trim();
    const aria = el.getAttribute('aria-label') || '';

    // [로그인.html]
    if (el.tagName === 'BUTTON' && (
      text.includes('카카오로 3초 만에 시작하기') ||
      text.includes('네이버로 시작하기') ||
      text.includes('Apple로 계속하기') ||
      text.includes('이메일 또는 휴대폰 번호로 로그인') ||
      text.includes('둘러보기 모드 체험')
    )) {
      el.addEventListener('click', () => go('홈.html'));
    }
    if (el.tagName === 'BUTTON' && text === '회원가입') {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [아기.html]
    if (el.id === 'startBtn' || (el.tagName === 'BUTTON' && text.includes('아이봄 맞춤 케어 시작하기'))) {
      el.onclick = (e) => {
        e.preventDefault();
        el.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span><span>맞춤 케어 큐레이션 구성 중...</span>';
        setTimeout(() => go('홈.html'), 500);
      };
    }

    // [홈.html]
    if (aria === '아이 성장일기 바로가기' || aria === '아이 정보 변경') {
      el.addEventListener('click', () => go('아기.html'));
    }
    if (el.tagName === 'A' && text.includes('다음 예방접종:')) {
      el.setAttribute('href', '스케줄.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('스케줄.html'); });
    }
    if (el.tagName === 'A' && text.includes('전체 타임라인')) {
      el.setAttribute('href', '기록.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('기록.html'); });
    }
    if (el.tagName === 'A' && text === '더보기') {
      el.setAttribute('href', '지도.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('지도.html'); });
    }
    if (el.tagName === 'A' && (text.includes('베베숲 에코 라인') || text.includes('메르베 프리미엄 오가닉'))) {
      el.setAttribute('href', '쇼핑.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('쇼핑.html'); });
    }

    // [기록.html]
    if (el.tagName === 'BUTTON' && text.includes('전체보기')) {

      window.location.href = page;
    }
  }

  // 1. data-path 기반 네비게이션 자동 연결
  const pathMap = {
    'home-dashboard': '홈.html',
    'daily-feed': '홈.html',
    'home': '홈.html',
    'baby-log': '기록.html',
    'growth-records': '기록.html',
    'quick-logger': '기록.html',
    'family-outing': '지도.html',
    'outing': '지도.html',

    'shopping': '쇼핑.html',
    'mom-community': '단체.html',
    'community': '커뮤.html',
    'chat-community': '채팅.html',
    'parent-profile': '마이.html',
    'parenting-guide': '스케줄.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 스케줄, 프로필 -> 마이)
  const header = document.querySelector('header');

    // 로고 영역 클릭 시 홈으로 이동 (뒤로가기 버튼이 없는 메인 헤더인 경우)
    const leftBox = header.querySelector('.flex.items-center.gap-space-sm');
    if (leftBox && !leftBox.querySelector('button')) {
      leftBox.style.cursor = 'pointer';
      leftBox.addEventListener('click', () => go('홈.html'));
    }

    // 알림 버튼 -> 스케줄.html
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          go('스케줄.html');
        });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {

            go('마이.html');
          });
        }
      }
    });

<script id="ibom-sample2-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample2) {
      window.parent.navigateSample2(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 기반 네비게이션 자동 연결
  const pathMap = {
    'home-dashboard': '홈.html',
    'daily-feed': '홈.html',
    'home': '홈.html',
    'baby-log': '기록.html',
    'growth-records': '기록.html',
    'quick-logger': '기록.html',
    'family-outing': '지도.html',
    'outing': '지도.html',
    'baby-shopping': '쇼핑.html',
    'shopping': '쇼핑.html',
    'mom-community': '단체.html',
    'community': '커뮤.html',
    'chat-community': '채팅.html',
    'parent-profile': '마이.html',
    'parenting-guide': '스케줄.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 스케줄, 프로필 -> 마이)
  const header = document.querySelector('header');
  if (header) {
    // 로고 영역 클릭 시 홈으로 이동 (뒤로가기 버튼이 없는 메인 헤더인 경우)
    const leftBox = header.querySelector('.flex.items-center.gap-space-sm');
    if (leftBox && !leftBox.querySelector('button')) {
      leftBox.style.cursor = 'pointer';
      leftBox.addEventListener('click', () => go('홈.html'));
    }

    // 알림 버튼 -> 스케줄.html
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          go('스케줄.html');
        });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample2) {
            window.parent.navigateBackSample2();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });

    // 우측 상단 person 아이콘 또는 프로필 이미지 -> 마이.html
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const p = span.closest('div, a, button');
        if (p) {
          p.style.cursor = 'pointer';
          p.addEventListener('click', (e) => {
            e.preventDefault();
            go('마이.html');
          });
        }
      }
    });
  }

  // 3. 각 페이지별 주요 버튼 및 배너/카드 인터랙션 연결
  document.querySelectorAll('button, a, article, section, div').forEach(el => {
    const text = (el.innerText || '').trim();
    const aria = el.getAttribute('aria-label') || '';

    // [로그인.html]

      text.includes('Apple로 계속하기') ||

      text.includes('둘러보기 모드 체험')

      el.addEventListener('click', () => go('홈.html'));
    }
    if (el.tagName === 'BUTTON' && text === '회원가입') {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [아기.html]
    if (el.id === 'startBtn' || (el.tagName === 'BUTTON' && text.includes('아이봄 맞춤 케어 시작하기'))) {

    if (el.tagName === 'A' && text.includes('전체 타임라인')) {

  (function initHotDealCountdown() {
    const timerElem = document.getElementById('deal-timer');
    if (!timerElem) return;
    
    let totalSeconds = 4 * 3600 + 32 * 60 + 15;
    
    setInterval(() => {
      if (totalSeconds <= 0) {
        totalSeconds = 6 * 3600; // loop back for preview
      } else {
        totalSeconds--;
      }
      const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      timerElem.textContent = `${hrs}:${mins}:${secs}`;
    }, 1000);
  })();

  <script>
    // 각 <template> 태그에서 페이지별 HTML 코드를 안전하게 불러옵니다.
    const PAGES = {};
    document.querySelectorAll('template.page-template').forEach(tpl => {
      const pageName = tpl.getAttribute('data-page');
      PAGES[pageName] = tpl.innerHTML;
    });

    const historyStack = ['홈.html'];
    let isMobileFrame = true;

    const frame = document.getElementById('proto-frame');
    const badge = document.getElementById('current-badge');

    window.navigateSample2 = function(pageName, pushHistory = true) {
      if (!PAGES[pageName]) return;
      if (pushHistory && historyStack[historyStack.length - 1] !== pageName) {
        historyStack.push(pageName);
      }
      frame.srcdoc = PAGES[pageName];
      badge.textContent = pageName;


      document.querySelectorAll('.nav-pill').forEach(btn => {
        if (btn.getAttribute('data-file') === pageName) {
          btn.className = 'nav-pill shrink-0 px-2.5 py-1 rounded-full text-xs font-bold bg-[#ff7052] text-white shadow transition-all';
        } else {
          btn.className = 'nav-pill shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold bg-[#35322f] text-[#e4e2de] hover:bg-[#ff7052] hover:text-white transition-all';
        }
      });
    };

    window.navigateBackSample2 = function() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        window.navigateSample2(prev, false);
      } else {
        window.navigateSample2('홈.html', false);
      }
    };

    window.toggleDeviceFrame = function() {
      const wrapper = document.getElementById('device-wrapper');
      const label = document.getElementById('frame-toggle-label');
      isMobileFrame = !isMobileFrame;
      if (isMobileFrame) {
        wrapper.className = 'w-full max-w-[440px] h-full md:h-[94%] md:rounded-[36px] md:border-[6px] md:border-[#35322f] overflow-hidden shadow-2xl bg-[#fbf9f5] transition-all duration-300 relative';
        label.textContent = '모바일 뷰';
      } else {
        wrapper.className = 'w-full h-full overflow-hidden bg-[#fbf9f5] transition-all duration-300 relative';
        label.textContent = '전체화면 뷰';
      }
    };

    // 초기 화면: 홈.html 로드
    window.navigateSample2('홈.html', false);
  </script>
